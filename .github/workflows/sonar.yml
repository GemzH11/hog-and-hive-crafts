name: SonarQube Analysis

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 #v5.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarQube scanner packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93d1dc0 #v4.2.3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyse with SonarQube
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          cd backend
          PR_ARGS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_ARGS="-Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
                     -Dsonar.pullrequest.branch=${{ github.head_ref }} \
                     -Dsonar.pullrequest.base=${{ github.base_ref }}"
          fi
          mvn clean verify -Pcoverage sonar:sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            ${PR_ARGS}
