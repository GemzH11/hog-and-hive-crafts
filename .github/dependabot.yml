version: 2
updates:
  # Backend: Spring Boot / Maven dependencies
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework*"
      testing:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.testcontainers*"
          - "io.rest-assured*"
      database:
        patterns:
          - "org.postgresql*"
          - "org.flywaydb*"
      build-tools:
        patterns:
          - "org.apache.maven*"
          - "org.jacoco*"

  # Frontend: npm dependencies for the React/Vite app
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router*"
      testing:
        patterns:
          - "@testing-library/*"
          - "vitest"
          - "@vitest/*"
          - "playwright"
          - "@playwright/test"
          - "msw"
      linting-and-types:
        patterns:
          - "eslint*"
          - "typescript*"
          - "@types/*"
      build-and-styling:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
          - "tailwindcss"
          - "@tailwindcss/postcss"
          - "postcss"
          - "autoprefixer"
          - "jsdom"
          - "globals"
