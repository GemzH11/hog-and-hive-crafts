app:
  cors:
    allowed-origins:
      - ${CORS_FRONTEND_ORIGIN:http://localhost:5173}
spring:
  application:
    name: backend
  config:
#    This allows the use of .env files for configuration
    import: optional:file:../../../../.env[.properties]
  datasource:
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hogandhivecrafts_db}
    username: ${SPRING_DATASOURCE_USERNAME:user}
  flyway:
    enabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
