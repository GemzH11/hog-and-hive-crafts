spring:
  application:
    name: backend
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
app:
  cors:
    # CORS: comma-separated list of allowed origins (dev only usually).
    # Leave blank to disable cross-origin access by default.
    allowed-origins: http://localhost:5173